# tack pins. generated by flake-file write-tack.
# nix reads pins.lock.json; this file drives tack update

[tack]
recomposable = true

[inputs.den]
url = "github:vic/den"

[inputs.disko]
url = "github:nix-community/disko/latest"
follows = { nixpkgs = "nixpkgs" }

[inputs.dms-plugin-registry]
url = "github:AvengeMedia/dms-plugin-registry"
follows = { nixpkgs = "nixpkgs" }

[inputs.flake-file]
url = "github:vic/flake-file"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"
follows = { nixpkgs-lib = "nixpkgs" }

[inputs.flatpak]
url = "github:gmodena/nix-flatpak/?ref=latest"

[inputs.helix-git]
url = "github:helix-editor/helix"

[inputs.home-manager]
url = "github:nix-community/home-manager"
follows = { nixpkgs = "nixpkgs" }

[inputs.import-tree]
url = "github:denful/import-tree"

[inputs.nix-gaming]
url = "github:fufexan/nix-gaming"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"
follows = { nixpkgs = "nixpkgs" }

[inputs.nix4vscode]
url = "github:nix-community/nix4vscode"
follows = { nixpkgs = "nixpkgs" }

[inputs.nixpkgs]
url = "github:nixos/nixpkgs?ref=nixos-unstable"

[inputs.nvf]
url = "github:NotAShelf/nvf"
follows = { nixpkgs = "nixpkgs" }

[inputs.stylix]
url = "github:nix-community/stylix"
follows = { nixpkgs = "nixpkgs" }

[inputs.vicinae-extensions]
url = "github:vicinaehq/extensions"
follows = { nixpkgs = "nixpkgs" }

[inputs.zen-browser]
url = "github:0xc000022070/zen-browser-flake"
follows = { home-manager = "home-manager", nixpkgs = "nixpkgs" }
